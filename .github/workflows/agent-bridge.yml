name: agent-bridge

# Every agent-bridge suite that needs no API key, no real Supabase project and no real Slack workspace:
# end-to-end (SQLite + Supabase stand-in), security, concurrency, CLI, and the adversary-round regressions.
# The Supabase stand-in is a real Postgres (below) with Supabase's roles and grants, behind a small
# PostgREST look-alike (test/fake-postgrest.js); Slack is test/fake-slack.js. Live runs (npm run test:live)
# need the project's keys and stay manual. Mutation testing (npm run test:mutations) is slow and manual.
#
# Matrix: Linux x Node 22/24 runs everything, with a Postgres 16 service container. macOS and Windows x Node 22/24
# run every suite that needs no Postgres (AGENT_BRIDGE_TEST_NO_PG=1 makes cli/regressions skip their Postgres
# parts; the supabase-local e2e/concurrency/security runs are simply not requested). See docs/notes/portability.md.

on:
  push:
    paths:
      - "agent-bridge/**"
      - ".github/workflows/agent-bridge.yml"
  pull_request:
    paths:
      - "agent-bridge/**"
      - ".github/workflows/agent-bridge.yml"

jobs:
  test-linux:
    name: ${{ matrix.os }} / node ${{ matrix.node }} (all suites + Postgres)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: agent-bridge
    env:
      TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - run: node --version
      - run: npm ci
      - name: Every mutation still finds its target (no stale mutations after merges)
        run: node test/mutations.js --check
      - name: End-to-end (SQLite, Supabase stand-in, Slack stand-in, relay)
        run: node test/e2e.js sqlite supabase-local slack-local relay-local
      - name: Relay (keys, audit chain, retention, TLS/mTLS)
        run: node test/relay.js
      - name: Security (raw HTTP attacks with the publishable key)
        run: node test/security.js supabase-local relay-local
      - name: Slack (identity, hostile channel members, people addressing agents)
        run: node test/slack.js
      - name: Concurrency (separate processes)
        run: node test/concurrency.js sqlite supabase-local slack-local relay-local
      - name: CLI (init, hook, admin commands)
        run: node test/cli.js
      - name: Adversary round 1 regressions
        run: node test/regressions-r1.js
      - name: Adversary round 2 regressions (Slack, hooks, tokens, exec-form proxy/CA)
        run: node test/regressions-r2-client.js
      - name: DLP (secrets, card numbers, IBANs; block/redact/warn/off on every backend)
        run: node test/dlp.js
      - name: Corporate proxy and TLS inspection (forward proxy with its own CA)
        run: node test/proxy.js
      - name: doctor
        run: node test/doctor.js

  # macOS and Windows runners have no Postgres service containers, so only the suites that never touch
  # Postgres run here (SQLite and the Slack stand-in, plus the CLI/regression parts that need no database).
  test-portable:
    name: ${{ matrix.os }} / node ${{ matrix.node }} (no Postgres)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        working-directory: agent-bridge
    env:
      AGENT_BRIDGE_TEST_NO_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - run: node --version
      - run: npm ci
      - name: End-to-end (SQLite, Slack stand-in, relay)
        run: node test/e2e.js sqlite slack-local relay-local
      - name: Relay (keys, audit chain, retention, TLS/mTLS where openssl exists)
        run: node test/relay.js
      - name: Security (relay)
        run: node test/security.js relay-local
      - name: Slack (identity, hostile channel members, people addressing agents)
        run: node test/slack.js
      - name: Concurrency (separate processes)
        run: node test/concurrency.js sqlite slack-local relay-local
      - name: CLI (init, hook, token files, Slack; Postgres part skipped)
        run: node test/cli.js
      - name: Adversary round 1 regressions (SQLite and CLI parts)
        run: node test/regressions-r1.js
      - name: Adversary round 2 regressions (Slack, hooks, tokens, exec-form proxy/CA)
        run: node test/regressions-r2-client.js
