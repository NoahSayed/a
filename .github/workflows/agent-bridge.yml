name: agent-bridge

# Every agent-bridge suite that needs no API key and no real Supabase project:
# end-to-end (SQLite + Supabase stand-in), security, concurrency, CLI, and the adversary-round regressions.
# The Supabase stand-in is a real Postgres (below) with Supabase's roles and grants, behind a small
# PostgREST look-alike (test/fake-postgrest.js). Live runs against a real project (npm run test:live)
# need the project's keys and stay manual. Mutation testing (npm run test:mutations) is slow and manual.

on:
  push:
    paths:
      - "agent-bridge/**"
      - ".github/workflows/agent-bridge.yml"
  pull_request:
    paths:
      - "agent-bridge/**"
      - ".github/workflows/agent-bridge.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: agent-bridge
    env:
      TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - run: node --version
      - run: npm ci
      - name: End-to-end (SQLite + Supabase stand-in)
        run: node test/e2e.js sqlite supabase-local
      - name: Security (raw HTTP attacks with the publishable key)
        run: node test/security.js supabase-local
      - name: Concurrency (separate processes)
        run: node test/concurrency.js sqlite supabase-local
      - name: CLI (init, hook, admin commands)
        run: node test/cli.js
      - name: Adversary round 1 regressions
        run: node test/regressions-r1.js
